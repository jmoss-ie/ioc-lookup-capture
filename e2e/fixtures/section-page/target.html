<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: rgb(255, 220, 0); }
      /* Same classes as the Log Analytics query view. 400x300 content + 4px
         border = 408x308 CSS px. ?shift=-50 moves it partly out of view. */
      .main-container {
        position: absolute; left: 30px; top: 20px;
        width: 400px; height: 300px;
        border: 4px solid rgb(255, 0, 0);
        background: rgb(0, 90, 200);
      }
      .decoy { position: absolute; left: 500px; top: 20px; width: 50px; height: 50px; background: rgb(255, 0, 255); }
    </style>
  </head>
  <body>
    <div class="flex-column listener-to-user-interaction main-container" id="target"></div>
    <div class="main-container decoy"></div>
    <script>
      const shift = Number(new URLSearchParams(location.search).get("shift") || 0);
      if (shift) document.getElementById("target").style.top = 20 + shift + "px";
    </script>
  </body>
</html>
