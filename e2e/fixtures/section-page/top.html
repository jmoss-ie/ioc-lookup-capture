<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Section capture fixture (top)</title>
    <style>
      html, body { margin: 0; background: rgb(0, 160, 0); }
      header { height: 37px; background: rgb(40, 40, 40); }
      /* Stands in for the Azure portal blade: the Logs page lives in an iframe
         from another site, with its own border and padding to offset. */
      iframe {
        position: absolute; left: 40px; top: 60px;
        width: 900px; height: 600px;
        border: 3px solid rgb(0, 0, 0); padding: 5px;
        background: rgb(0, 160, 0);
      }
    </style>
  </head>
  <body>
    <header></header>
    <iframe id="outer"></iframe>
    <script>
      // ?inner=<url of inner.html on another site>&target=<url of target.html>
      const q = new URLSearchParams(location.search);
      document.getElementById("outer").src = q.get("inner") + "?target=" + encodeURIComponent(q.get("target") || "");
    </script>
  </body>
</html>
