<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lookup</title>
    <style>
      html, body { margin: 0; height: 100%; background: rgb(200, 0, 200); }
      .cf-turnstile { width: 300px; height: 65px; margin: 40px; }
    </style>
  </head>
  <body>
    <!-- Stands in for a Turnstile widget: its frame inside a CLOSED shadow
         root (out of reach of a page script), so only the .cf-turnstile
         container can be found. Removed after ?clearAfter= ms. -->
    <div class="cf-turnstile" id="ts"></div>
    <script>
      const root = document.getElementById("ts").attachShadow({ mode: "closed" });
      const f = document.createElement("iframe");
      f.src = "about:blank";
      f.width = "300";
      f.height = "65";
      f.style.border = "0";
      root.appendChild(f);
      setTimeout(() => {
        document.getElementById("ts").remove();
        document.body.style.background = "rgb(0, 150, 0)";
      }, Number(new URLSearchParams(location.search).get("clearAfter") || 0));
    </script>
  </body>
</html>
