<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lookup</title>
    <style>html, body { margin: 0; height: 100%; background: rgb(200, 0, 200); }</style>
  </head>
  <body>
    <!-- A visible captcha checkbox frame (local URL, so nothing leaves the
         test), removed after ?clearAfter= ms as if solved. -->
    <iframe id="cap" src="/recaptcha/api2/anchor.html?k=test" width="304" height="78" style="margin: 40px; border: 0"></iframe>
    <script>
      const clearAfter = Number(new URLSearchParams(location.search).get("clearAfter") || 0);
      setTimeout(() => {
        document.getElementById("cap").remove();
        document.body.style.background = "rgb(0, 150, 0)";
      }, clearAfter);
    </script>
  </body>
</html>
